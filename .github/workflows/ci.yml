# Runs on every pull request and on every push to main: the same suites deploy.sh runs before a deploy,
# so a broken change is caught before it is merged instead of at deploy time.
#
# Nothing here touches development or production. Each job gets its own throw-away Postgres on
# localhost:5433 (the address the test guards insist on) and a generated backend/.env.test. No secrets
# are used: Google, Telegram and e-mail are switched off by the npm scripts themselves.
name: ci
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20 # same major as backend/Dockerfile

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres-test:
        image: postgres:16-alpine
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: navet_test }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # package-lock.json is not in git, so this is `npm install` (not `npm ci`) and versions can drift
      # between runs. --legacy-peer-deps: see ENV-SETUP.md.
      - run: npm install --legacy-peer-deps
      - name: backend/.env.test (test values only)
        run: |
          cat > backend/.env.test <<'EOF'
          DATABASE_URL=postgresql://test:test@localhost:5433/navet_test
          BACKEND_PORT=5006
          JWT_SECRET=ci-only-not-a-secret
          EOF
      - name: generate the Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: migration files (no destructive statement without an acknowledgement)
        run: npm run migrate:check --prefix backend
      - name: tests of the migration and environment scripts
        run: npm run test:scripts --prefix backend
      - name: task board scripts
        run: npm run tasks:test
      - name: unit tests
        run: npm run test --prefix backend
      - name: type-check and build
        run: npm run build --prefix backend
      - name: e2e (applies the migrations to the throw-away database first)
        run: npm run test:e2e --prefix backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --legacy-peer-deps
      - name: component tests
        run: npm run test --prefix frontend

  browser:
    # The slowest job (it starts a real backend and Expo's web server), so it runs only once the fast ones pass.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres-test:
        image: postgres:16-alpine
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: navet_test }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --legacy-peer-deps
      - name: backend/.env.test (test values only)
        run: |
          cat > backend/.env.test <<'EOF'
          DATABASE_URL=postgresql://test:test@localhost:5433/navet_test
          BACKEND_PORT=5006
          JWT_SECRET=ci-only-not-a-secret
          TELEGRAM_WEBHOOK_SECRET=e2e-test-telegram-webhook-secret
          EOF
      - name: generate the Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: browser tests (Desktop Chrome + Mobile Chrome)
        run: npm run test:e2e --prefix frontend
      - name: keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
