# fly.toml app configuration file generated for navet-to-retro-backend on 2026-08-03T22:24:00+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'navet-to-retro-backend'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

# Runs in the NEW image before the new version serves traffic. It applies a schema change ONLY if an approval for that
# exact SQL is baked into the image (backend/schema-approvals/); otherwise it fails and the deploy is aborted, leaving
# the running version untouched. Nothing runs when the app starts, so a restart can never alter the database.
[deploy]
  release_command = 'node scripts/schema-sync.js release'

[http_service]
  internal_port = 5005
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
