services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=navet_test
    ports:
      - "5433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:5005:5005"
    environment:
      - BACKEND_PORT=5005
      - DATABASE_URL=${DATABASE_URL}
      - EXPO_PUBLIC_BACKEND_URL_PROD=${EXPO_PUBLIC_BACKEND_URL_PROD}
      - RESEND_API_KEY=${RESEND_API_KEY}
    volumes:
      - ./backend:/app
      - /app/node_modules
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:8085:8081"
    environment:
      - BROWSER=none
      - EXPO_PUBLIC_BACKEND_URL=${PUBLIC_BACKEND_URL:-http://localhost:5005}
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres-test-data:
